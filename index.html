<!DOCTYPE html>
<html>

<head>

<title>AI-Powered Mental Health Support Chatbot</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>

<!-- Animated Background -->

<div class="animatedBackground">
  <!-- Pre-render a bunch of emojis -->
  <span>🧠</span>
  <span>❤️</span>
  <span>🩺</span>
  <span>💊</span>
  <span>🧬</span>
  <span>🏥</span>
  <span>💙</span>
  <span>🩹</span>
  <span>🧠</span>
  <span>❤️</span>
  <span>🩺</span>
  <span>💊</span>
  <span>🧬</span>
  <span>🏥</span>
  <span>💙</span>
  <span>🩹</span>
</div>


<header class="header">

<div class="logo">🧠</div>

<div class="titleBox">
<h1 class="title">AI-Powered Mental Health Support Chatbot</h1>
</div>

</header>


<div class="chatContainer">

<div id="chatArea"></div>

</div>


<div class="inputArea">

<input
type="text"
id="userInput"
placeholder="Share how you feel..."
onkeypress="if(event.key==='Enter') sendMessage()"
>

<button class="sendBtn" onclick="sendMessage()">Send</button>

<button class="micBtn" onclick="startVoice()">🎤</button>

<button class="speakerBtn" onclick="toggleVoice()">🔊</button>

<label class="uploadBtn">
📎
<input type="file" onchange="handleFileUpload(event)">
</label>

</div>


<script src="script.js"></script>

</body>
</html>
